<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>세발자전거 열기</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f0; color: #25382e; font-family: system-ui, sans-serif; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.75rem; }
    p { line-height: 1.7; }
    a { display: inline-block; padding: .85rem 1.5rem; border-radius: .7rem; background: #315d48; color: white; text-decoration: none; }
    a:focus-visible { outline: 3px solid #a26514; outline-offset: 4px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>세발자전거</h1>
    <p id="status" role="status">독서일지를 준비하고 있습니다.</p>
    <a id="open" hidden>독서일지 열기</a>
    <noscript><p>자동 이동을 위해 브라우저에서 자바스크립트를 허용해 주세요.</p></noscript>
  </main>
  <script>
    // 아래 따옴표 안에 평소 접속하는 프런트 웹앱의 /exec 주소를 넣으세요.
    // 저장 서버 주소나 인증 토큰은 넣지 않습니다.
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwfcKUZCE6rx9kQFmQ--XefaeOcrWX-QHX322DvHBV_1iZJ77xfAXhDPWNgFfmB0ijHHg/exec";

    const status = document.getElementById("status");
    const openLink = document.getElementById("open");
    // 공개용 배포 주소만 허용합니다. 인증 정보가 섞인 쿼리 문자열도 제외합니다.
    if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(WEB_APP_URL)) {
      openLink.href = WEB_APP_URL;
      openLink.hidden = false;
      status.textContent = "독서일지로 이동합니다. 자동으로 열리지 않으면 아래 버튼을 눌러 주세요.";
      window.location.replace(WEB_APP_URL);
    } else {
      status.textContent = "접속 주소가 아직 설정되지 않았습니다. index.html의 WEB_APP_URL을 확인해 주세요.";
    }
  </script>
</body>
</html>
